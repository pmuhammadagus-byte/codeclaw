<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="CodeClaw — logo singa neon biru dengan teks CODECLAW dan tagline AI Automation Coding">
  <defs>
    <!-- Latar -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04070d"/>
      <stop offset="42%" stop-color="#060b14"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <radialGradient id="haloA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#0ea5e9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.26"/>
      <stop offset="62%" stop-color="#4338ca" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Mark: surai singa -->
    <radialGradient id="maneGrad" cx="0.5" cy="0.52" r="0.62">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="46%" stop-color="#0b4a63" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#04141f"/>
    </radialGradient>
    <linearGradient id="maneStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="faceFill" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#0a1a26"/>
      <stop offset="100%" stop-color="#050d15"/>
    </linearGradient>

    <!-- Teks -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0.22">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="46%" stop-color="#cffafe"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gashGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="26%" stop-color="#67e8f9"/>
      <stop offset="64%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <!-- Pola -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#7dd3fc" fill-opacity="0.10"/>
    </pattern>

    <!-- Filter -->
    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="markGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="11" flood-color="#22d3ee" flood-opacity="0.6"/>
    </filter>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="titleGlow" x="-25%" y="-40%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ===== Latar ===== -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#dots)"/>
  <ellipse cx="1090" cy="120" rx="360" ry="270" fill="url(#haloA)" filter="url(#softBlur)"/>
  <ellipse cx="150" cy="300" rx="320" ry="230" fill="url(#haloB)" filter="url(#softBlur)"/>

  <!-- ===== Dekorasi kanan: sarang heksagon ===== -->
  <g fill="none">
    <polygon points="1112,30 1241.9,105 1241.9,255 1112,330 982.1,255 982.1,105" stroke="#22d3ee" stroke-opacity="0.11" stroke-width="1.5"/>
    <polygon points="1112,70 1207.3,125 1207.3,235 1112,290 1016.7,235 1016.7,125" stroke="#38bdf8" stroke-opacity="0.09" stroke-width="1.5"/>
    <circle cx="1112" cy="180" r="168" stroke="#6366f1" stroke-opacity="0.07" stroke-width="1.2" stroke-dasharray="2 9"/>
  </g>

  <!-- Cakar diagonal (dekoratif) -->
  <g stroke="url(#gashGrad)" stroke-linecap="round" fill="none">
    <path d="M902,332 L1176,96" stroke-width="4" stroke-opacity="0.85"/>
    <path d="M950,332 L1224,96" stroke-width="4" stroke-opacity="0.5"/>
    <path d="M998,332 L1272,96" stroke-width="4" stroke-opacity="0.28"/>
  </g>

  <!-- Garis neon atas -->
  <rect x="0" y="0" width="1280" height="2.5" fill="url(#topLine)"/>

  <!-- Bracket sudut -->
  <g stroke="#22d3ee" stroke-opacity="0.32" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M20,58 V20 H58"/>
    <path d="M1222,20 H1260 V58"/>
    <path d="M1260,302 V340 H1222"/>
    <path d="M58,340 H20 V302"/>
  </g>

  <!-- ===== Mark singa ===== -->
  <g transform="translate(72,84) scale(0.9)" filter="url(#markGlow)">
    <!-- Surai: bintang 12 sudut -->
    <polygon points="100,4 119.7,26.6 148,16.9 153.7,46.3 183.1,52 173.4,80.3 196,100 173.4,119.7 183.1,148 153.7,153.7 148,183.1 119.7,173.4 100,196 80.3,173.4 52,183.1 46.3,153.7 16.9,148 26.6,119.7 4,100 26.6,80.3 16.9,52 46.3,46.3 52,16.9 80.3,26.6"
             fill="url(#maneGrad)" stroke="url(#maneStroke)" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- Cincin gigi 8 -->
    <polygon points="100,32 121,49.2 148.1,51.9 150.8,79 168,100 150.8,121 148.1,148.1 121,150.8 100,168 79,150.8 51.9,148.1 49.2,121 32,100 49.2,79 51.9,51.9 79,49.2"
             fill="#050e17" fill-opacity="0.55" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- Wajah heksagon -->
    <polygon points="100,62 136.4,83 136.4,125 100,146 63.6,125 63.6,83"
             fill="url(#faceFill)" stroke="#67e8f9" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="100,70 129.4,87 129.4,121 100,138 70.6,121 70.6,87"
             fill="none" stroke="#22d3ee" stroke-opacity="0.28" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Mata neon -->
    <g fill="#a5f3fc" filter="url(#neonGlow)">
      <path d="M78,91 L92,96 L89,105 L78,98 Z"/>
      <path d="M122,91 L108,96 L111,105 L122,98 Z"/>
    </g>
    <!-- Moncong -->
    <path d="M100,110 L108,119 L100,130 L92,119 Z" fill="#67e8f9" fill-opacity="0.9" filter="url(#neonGlow)"/>
    <!-- Kumis/claw accent -->
    <g stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
      <path d="M86,132 L72,138"/>
      <path d="M114,132 L128,138"/>
    </g>
  </g>

  <!-- ===== Teks ===== -->
  <text x="296" y="179" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="82" font-weight="800"
        letter-spacing="2.5" fill="url(#titleGrad)" filter="url(#titleGlow)">CODECLAW</text>

  <rect x="298" y="200" width="128" height="2.5" rx="1.25" fill="url(#ruleGrad)"/>

  <text x="298" y="243" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20.5"
        letter-spacing="6.5" fill="#67d7f0">AI • AUTOMATION • CODING</text>

  <text x="298" y="288" font-family="'SF Mono',ui-monospace,'Cascadia Code',Consolas,monospace"
        font-size="12.5" letter-spacing="1.6" fill="#3e5876">OPEN SOURCE · MIT · NODE 22.5+</text>

  <!-- Aksen tipis di ujung tagline -->
  <rect x="298" y="252" width="46" height="2" rx="1" fill="#22d3ee" fill-opacity="0.5"/>
</svg>
