<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Contoh sesi CodeClaw Pro di terminal">
  <defs>
    <clipPath id="win">
      <rect x="0" y="0" width="1200" height="560" rx="14"/>
    </clipPath>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <radialGradient id="bodyGlow" cx="0.15" cy="0" r="0.9">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="1188" height="548" rx="14" fill="#000000" opacity="0.35" filter="url(#shadow)"/>

  <g clip-path="url(#win)">
    <rect width="1200" height="560" fill="#0d1117"/>
    <rect width="1200" height="560" fill="url(#bodyGlow)"/>
    <rect width="1200" height="46" fill="url(#chrome)"/>
    <rect y="45" width="1200" height="1" fill="#243044"/>

    <circle cx="26" cy="23" r="6.5" fill="#ff5f57"/>
    <circle cx="48" cy="23" r="6.5" fill="#febc2e"/>
    <circle cx="70" cy="23" r="6.5" fill="#28c840"/>
    <text x="600" y="28" text-anchor="middle" font-family="'SF Mono',ui-monospace,Consolas,monospace" font-size="13" fill="#64748b">codeclaw — bash — 88×24</text>

    <g font-family="'SF Mono',ui-monospace,'Cascadia Code',Consolas,monospace" font-size="17">
      <text x="40" y="94" fill="#4ade80">$<tspan fill="#e2e8f0" dx="11">git clone https://github.com/pmuhammadagus-byte/codeclaw.git</tspan></text>
      <text x="40" y="124" fill="#64748b">Cloning into 'codeclaw'...</text>
      <text x="40" y="154" fill="#64748b">done.</text>

      <text x="40" y="214" fill="#4ade80">$<tspan fill="#e2e8f0" dx="11">cd codeclaw &amp;&amp; node cli.js start</tspan></text>

      <text x="40" y="274" fill="#22d3ee">CodeClaw Pro</text>
      <text x="176" y="274" fill="#475569">·</text>
      <text x="196" y="274" fill="#94a3b8">custom/glm-5.3</text>

      <text x="40" y="334" fill="#67e8f9">›</text>
      <text x="64" y="334" fill="#f1f5f9">tambah endpoint login di server.js</text>

      <text x="64" y="366" fill="#22d3ee">●</text>
      <text x="88" y="366" fill="#67e8f9">read_file</text>
      <text x="250" y="366" fill="#94a3b8">server.js</text>

      <text x="64" y="396" fill="#22d3ee">●</text>
      <text x="88" y="396" fill="#67e8f9">edit_file</text>
      <text x="250" y="396" fill="#94a3b8">+18 lines</text>

      <text x="64" y="426" fill="#22d3ee">●</text>
      <text x="88" y="426" fill="#67e8f9">shell</text>
      <text x="250" y="426" fill="#94a3b8">npm test</text>
      <text x="358" y="426" fill="#4ade80">✓ 12 passed</text>

      <text x="40" y="486" fill="#4ade80">✓ Selesai — 1 file diubah.</text>

      <text x="40" y="524" fill="#4ade80">$</text>
      <rect x="58" y="509" width="10" height="19" fill="#22d3ee" opacity="0.85"/>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="558" rx="14" fill="none" stroke="#243044" stroke-width="2"/>
</svg>
