<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="CodeClaw di terminal hacker bergaya jendela macOS dengan teks neon">
  <defs>
    <clipPath id="winClip">
      <rect x="28" y="24" width="1144" height="552" rx="14"/>
    </clipPath>

    <!-- Jendela -->
    <linearGradient id="chromeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2436"/>
      <stop offset="100%" stop-color="#121a28"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#05080d"/>
      <stop offset="55%" stop-color="#03060a"/>
      <stop offset="100%" stop-color="#060b12"/>
    </linearGradient>
    <linearGradient id="statusGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.65"/>
      <stop offset="42%" stop-color="#2b3f57" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Cahaya -->
    <radialGradient id="glowTL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#0ea5e9" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="titleNeon" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cffafe"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="clawGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>

    <!-- Pola -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.2" y="0" fill="#ffffff" fill-opacity="0.014"/>
    </pattern>
    <pattern id="microGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#7dd3fc" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <!-- Filter -->
    <filter id="winShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dotGlow" x="-180%" y="-180%" width="460%" height="460%">
      <feGaussianBlur stdDeviation="2.4" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Bayangan jendela -->
  <rect x="28" y="30" width="1144" height="552" rx="14" fill="#000000" opacity="0.55" filter="url(#winShadow)"/>

  <g clip-path="url(#winClip)">
    <!-- Badan -->
    <rect x="28" y="24" width="1144" height="552" fill="url(#bodyGrad)"/>
    <rect x="28" y="24" width="1144" height="552" fill="url(#microGrid)"/>
    <ellipse cx="240" cy="120" rx="420" ry="300" fill="url(#glowTL)"/>
    <ellipse cx="1060" cy="520" rx="380" ry="280" fill="url(#glowBR)"/>

    <!-- Title bar -->
    <rect x="28" y="24" width="1144" height="48" fill="url(#chromeGrad)"/>
    <rect x="28" y="71" width="1144" height="1" fill="#26334a"/>
    <circle cx="56" cy="48" r="6.5" fill="#ff5f57"/>
    <circle cx="78" cy="48" r="6.5" fill="#febc2e"/>
    <circle cx="100" cy="48" r="6.5" fill="#28c840"/>

    <!-- Tab aktif -->
    <g>
      <rect x="128" y="34" width="196" height="28" rx="7" fill="#080d15" stroke="#233149"/>
      <circle cx="146" cy="48" r="4" fill="#22d3ee" filter="url(#dotGlow)"/>
      <text x="158" y="53" font-family="'SF Mono',ui-monospace,Consolas,monospace" font-size="12.5" fill="#93a9c6">codeclaw — zsh</text>
      <text x="342" y="53" font-family="'SF Mono',ui-monospace,Consolas,monospace" font-size="12.5" fill="#3a4a63">node</text>
      <text x="386" y="53" font-family="'SF Mono',ui-monospace,Consolas,monospace" font-size="12.5" fill="#3a4a63">tests</text>
    </g>
    <text x="1144" y="53" text-anchor="end" font-family="'SF Mono',ui-monospace,Consolas,monospace" font-size="12" fill="#3d4d68">~/codeclaw</text>

    <!-- ===== Kolom kiri ===== -->
    <g font-family="'SF Mono',ui-monospace,'Cascadia Code',Consolas,monospace">
      <!-- Header -->
      <g stroke="url(#clawGrad)" stroke-width="3.4" stroke-linecap="round" fill="none" filter="url(#neon)">
        <path d="M62 132 L74 148"/>
        <path d="M74 128 L86 144"/>
        <path d="M86 124 L98 140"/>
      </g>
      <text x="112" y="148" font-size="30" font-weight="700" letter-spacing="1.8" fill="url(#titleNeon)" filter="url(#neonSoft)">CodeClaw</text>
      <text x="112" y="170" font-size="12.5" letter-spacing="1.4" fill="#4a6a86">AGENTIC SHELL · 27 TOOLS · MIT</text>
      <rect x="62" y="186" width="690" height="1" fill="#15202e"/>

      <!-- Baris log -->
      <g font-size="15.5">
        <text x="62" y="216" fill="#4ade80">❯</text>
        <text x="88" y="216" fill="#dbe6f3">./codeclaw init</text>
        <text x="232" y="216" fill="#67e8f9">--env termux</text>
        <text x="742" y="216" text-anchor="end" font-size="12.5" fill="#33506b">0.4s</text>

        <text x="88" y="242" fill="#4c6079">✓ sandbox aktif · model glm · warm 128ms</text>

        <text x="62" y="268" fill="#4ade80">❯</text>
        <text x="88" y="268" fill="#dbe6f3">scan</text>
        <text x="136" y="268" fill="#67e8f9">--deep .</text>
        <text x="742" y="268" text-anchor="end" font-size="12.5" fill="#33506b">1.1s</text>

        <text x="88" y="294" fill="#4ade80">✓</text>
        <text x="106" y="294" fill="#8fa9c4">128 berkas · 0 temuan rawan</text>

        <text x="62" y="320" fill="#4ade80">❯</text>
        <text x="88" y="320" fill="#dbe6f3">patch auth.js</text>
        <text x="224" y="320" fill="#67e8f9">--add rate-limit</text>
        <text x="742" y="320" text-anchor="end" font-size="12.5" fill="#33506b">88ms</text>

        <text x="88" y="346" font-size="13.5" fill="#3f5470">@@ auth.js · 12,4 → 16,9 @@</text>
        <text x="88" y="368" font-size="13.5" fill="#4ade80">+ app.use(limit(req.ip, 60))</text>
        <text x="88" y="390" font-size="13.5" fill="#f87171">− // TODO: pindahkan ke middleware</text>

        <text x="88" y="418" fill="#4ade80">✓ patch diterapkan · 1 berkas</text>

        <text x="62" y="444" fill="#4ade80">❯</text>
        <text x="88" y="444" fill="#dbe6f3">npm test</text>
        <text x="742" y="444" text-anchor="end" font-size="12.5" fill="#33506b">1.2s</text>

        <text x="88" y="470" fill="#4ade80">✓ 32 lulus</text>
        <text x="182" y="470" fill="#f87171">0 gagal</text>
        <text x="240" y="470" fill="#4c6079">· 2 dilewati</text>

        <text x="88" y="496" fill="#67e8f9">✓ build sukses · bundle 41.2 kB</text>

        <rect x="62" y="514" width="690" height="1" fill="#15202e"/>

        <text x="62" y="542" fill="#4ade80">❯</text>
        <rect x="88" y="527" width="10" height="19" fill="#22d3ee" opacity="0.92">
          <animate attributeName="opacity" values="0.92;0.1;0.92" dur="1.15s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- Divider kolom -->
    <rect x="774" y="108" width="1" height="414" fill="#131e2c"/>

    <!-- ===== Kolom kanan: panel status ===== -->
    <g font-family="'SF Mono',ui-monospace,'Cascadia Code',Consolas,monospace">
      <text x="800" y="126" font-size="11.5" letter-spacing="2.4" fill="#3f5a75">SISTEM</text>

      <g font-size="12.5">
        <text x="800" y="176" letter-spacing="1.2" fill="#506b88">CPU</text>
        <rect x="872" y="168" width="200" height="6" rx="3" fill="#0e1826"/>
        <rect x="872" y="168" width="84" height="6" rx="3" fill="url(#barFill)"/>
        <text x="1144" y="176" text-anchor="end" fill="#7dd3fc">42%</text>

        <text x="800" y="210" letter-spacing="1.2" fill="#506b88">MEM</text>
        <rect x="872" y="202" width="200" height="6" rx="3" fill="#0e1826"/>
        <rect x="872" y="202" width="136" height="6" rx="3" fill="url(#barFill)"/>
        <text x="1144" y="210" text-anchor="end" fill="#7dd3fc">68%</text>

        <text x="800" y="244" letter-spacing="1.2" fill="#506b88">CTX</text>
        <rect x="872" y="236" width="200" height="6" rx="3" fill="#0e1826"/>
        <rect x="872" y="236" width="64" height="6" rx="3" fill="url(#barFill)"/>
        <text x="1144" y="244" text-anchor="end" fill="#7dd3fc">41k</text>

        <text x="800" y="278" letter-spacing="1.2" fill="#506b88">TOOLS</text>
        <rect x="872" y="270" width="200" height="6" rx="3" fill="#0e1826"/>
        <rect x="872" y="270" width="200" height="6" rx="3" fill="#34d399" fill-opacity="0.65"/>
        <text x="1144" y="278" text-anchor="end" fill="#6ee7b7">27/27</text>
      </g>

      <rect x="800" y="304" width="344" height="1" fill="#131e2c"/>

      <text x="800" y="330" font-size="11.5" letter-spacing="2.4" fill="#3f5a75">ENV</text>
      <g font-size="12.5">
        <text x="800" y="358" fill="#4c6079">OS</text>
        <text x="1144" y="358" text-anchor="end" fill="#a9c2da">linux aarch64</text>
        <text x="800" y="386" fill="#4c6079">SHELL</text>
        <text x="1144" y="386" text-anchor="end" fill="#a9c2da">zsh 5.9</text>
        <text x="800" y="414" fill="#4c6079">RUNTIME</text>
        <text x="1144" y="414" text-anchor="end" fill="#a9c2da">node v22.5.0</text>
      </g>

      <rect x="800" y="440" width="344" height="1" fill="#131e2c"/>

      <text x="800" y="466" font-size="11.5" letter-spacing="2.4" fill="#3f5a75">GIT</text>
      <g font-size="12.5">
        <circle cx="806" cy="491" r="4" fill="#34d399" filter="url(#dotGlow)"/>
        <text x="822" y="495" fill="#cbd5e1">main</text>
        <text x="1144" y="495" text-anchor="end" fill="#4c6079">bersih</text>
        <text x="800" y="521" fill="#4c6079">commit</text>
        <text x="1144" y="521" text-anchor="end" fill="#8fa9c4">e139cea</text>
      </g>
    </g>

    <!-- Scanline CRT -->
    <rect x="28" y="24" width="1144" height="552" fill="url(#scan)"/>

    <!-- Status bar -->
    <rect x="28" y="548" width="1144" height="28" fill="url(#statusGrad)"/>
    <rect x="28" y="547" width="1144" height="1" fill="#1d2a3e"/>
    <g font-family="'SF Mono',ui-monospace,Consolas,monospace" font-size="11.5">
      <rect x="44" y="556" width="62" height="14" rx="3" fill="#0f2a38"/>
      <text x="52" y="567" fill="#22d3ee" letter-spacing="1">NORMAL</text>
      <text x="120" y="567" fill="#4ade80">main</text>
      <text x="164" y="567" fill="#2f4156">│</text>
      <text x="176" y="567" fill="#3d5470">utf-8 · node 22.5 · 42ms</text>
      <text x="1078" y="567" fill="#3d5470">ln 528, col 12</text>
      <text x="1156" y="567" text-anchor="end" fill="#22d3ee">●</text>
    </g>
  </g>

  <!-- Border jendela -->
  <rect x="28.8" y="24.8" width="1142.4" height="550.4" rx="13.5" fill="none" stroke="url(#edgeGrad)" stroke-width="1.6"/>
</svg>
