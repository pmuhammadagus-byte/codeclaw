<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl">
        <h1 class="text-2xl font-bold mb-6 text-center bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Kalkulator</h1>
        <input id="display" readonly class="w-full h-20 mb-6 bg-slate-950 text-right text-4xl px-6 rounded-2xl border border-slate-800 focus:outline-none font-mono text-indigo-400 shadow-inner">
        <div id="keys" class="grid grid-cols-4 gap-3 mb-6"></div>
        <div class="border-t border-slate-800 pt-4">
            <div class="flex justify-between items-center mb-3">
                <span class="text-sm font-medium text-slate-500 uppercase tracking-wider">Riwayat</span>
                <button onclick="document.getElementById('hist').innerHTML=''" class="text-xs text-slate-600 hover:text-red-400 transition">Bersihkan</button>
            </div>
            <ul id="hist" class="space-y-2 text-sm max-h-40 overflow-y-auto pr-2 custom-scrollbar"></ul>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const keys = document.getElementById('keys');
        const hist = document.getElementById('hist');

        const buttons = [
            'C', '(', ')', '/',
            '7', '8', '9', '*',
            '4', '5', '6', '-',
            '1', '2', '3', '+',
            '0', '.', 'DEL', '='
        ];

        buttons.forEach(k => {
            const b = document.createElement('button');
            b.textContent = k;
            b.className = 'h-14 rounded-xl font-semibold text-lg transition active:scale-95 flex items-center justify-center';
            
            if (k === '=') b.className += ' bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-900/20';
            else if (k === 'C' || k === 'DEL') b.className += ' bg-slate-800 text-red-400 hover:bg-slate-700';
            else if (['/', '*', '-', '+', '(', ')'].includes(k)) b.className += ' bg-slate-800 text-indigo-400 hover:bg-slate-700';
            else b.className += ' bg-slate-800 hover:bg-slate-700 text-slate-300';

            b.onclick = () => {
                if (k === 'C') display.value = '';
                else if (k === 'DEL') display.value = display.value.slice(0, -1);
                else if (k === '=') {
                    try {
                        if (!display.value) return;
                        const res = Function('"use strict";return (' + display.value + ')')();
                        const item = document.createElement('li');
                        item.className = 'flex justify-between items-center bg-slate-800/50 p-2 rounded-lg border border-slate-800/50';
                        item.innerHTML = `<span class="text-slate-500">${display.value}</span><span class="font-mono text-indigo-300 font-bold">${res}</span>`;
                        hist.prepend(item);
                        display.value = res;
                    } catch {
                        display.value = 'Error';
                        setTimeout(() => display.value = '', 1000);
                    }
                } else display.value += k;
            };
            keys.appendChild(b);
        });
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</body>
</html>
