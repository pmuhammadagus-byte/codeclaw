<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Todo API — Express REST API with JSON persistence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#121a35"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>

    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="45%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="35%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <ellipse cx="140" cy="30" rx="340" ry="200" fill="url(#glowA)"/>
  <ellipse cx="1080" cy="320" rx="380" ry="220" fill="url(#glowB)"/>

  <!-- corner brackets -->
  <g stroke="#38bdf8" stroke-opacity="0.55" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M28 76V44a16 16 0 0 1 16-16h32"/>
    <path d="M1172 76V44a16 16 0 0 0-16-16h-32"/>
    <path d="M28 264v32a16 16 0 0 0 16 16h32"/>
    <path d="M1172 264v32a16 16 0 0 1-16 16h-32"/>
  </g>

  <!-- logo mark -->
  <g filter="shadow">
    <rect x="72" y="112" width="72" height="72" rx="18" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.65" stroke-width="2"/>
    <g stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M88 130l8 8 15-16" stroke="#22d3ee"/>
      <path d="M88 154l8 8 15-16" stroke="#a855f7"/>
      <path d="M120 136h10" stroke="#334155"/>
      <path d="M120 160h10" stroke="#334155"/>
    </g>
  </g>

  <!-- title -->
  <text x="172" y="140" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="60" font-weight="800" fill="url(#title)" filter="softGlow" letter-spacing="-1.5">Todo API</text>
  <rect x="174" y="156" width="330" height="3" rx="1.5" fill="url(#rule)"/>

  <text x="174" y="196" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" fill="#94a3b8" letter-spacing="0.4">REST API · Node.js + Express · JSON persistence</text>

  <!-- endpoint pills -->
  <g font-family="Consolas, Monaco, monospace" font-size="14" font-weight="700">
    <g>
      <rect x="174" y="222" width="96" height="34" rx="17" fill="#052e2b" stroke="#14b8a6" stroke-opacity="0.55"/>
      <text x="191" y="244" fill="#5eead4">GET</text>
    </g>
    <g>
      <rect x="282" y="222" width="104" height="34" rx="17" fill="#0b2a3a" stroke="#38bdf8" stroke-opacity="0.55"/>
      <text x="299" y="244" fill="#7dd3fc">POST</text>
    </g>
    <g>
      <rect x="398" y="222" width="88" height="34" rx="17" fill="#2a2205" stroke="#f59e0b" stroke-opacity="0.55"/>
      <text x="415" y="244" fill="#fcd34d">PUT</text>
    </g>
    <g>
      <rect x="498" y="222" width="124" height="34" rx="17" fill="#2b0d1a" stroke="#fb7185" stroke-opacity="0.55"/>
      <text x="513" y="244" fill="#fda4af">DELETE</text>
    </g>
    <g>
      <rect x="634" y="222" width="150" height="34" rx="17" fill="#1a1033" stroke="#a855f7" stroke-opacity="0.55"/>
      <text x="649" y="244" fill="#d8b4fe">todos.json</text>
    </g>
  </g>

  <!-- stats panel -->
  <g transform="translate(858 104)">
    <rect width="270" height="150" rx="18" fill="#0b1226" fill-opacity="0.82" stroke="#22d3ee" stroke-opacity="0.28"/>
    <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
      <text x="24" y="38" font-size="12" fill="#64748b" letter-spacing="2.5" font-weight="700">TEST SUITE</text>
      <text x="24" y="86" font-size="40" font-weight="800" fill="#5eead4">18<tspan font-size="18" fill="#64748b" font-weight="600"> / 18 pass</tspan></text>
      <rect x="24" y="102" width="222" height="8" rx="4" fill="#1e293b"/>
      <rect x="24" y="102" width="222" height="8" rx="4" fill="#22d3ee"/>
      <text x="24" y="134" font-size="12" fill="#94a3b8">atomik write · anti korup · zero deps</text>
    </g>
  </g>
</svg>
